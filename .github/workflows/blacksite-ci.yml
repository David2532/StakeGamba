name: BlackSite CI

on:
  push:
    branches:
      - codex/blacksite-aaa-studio
    paths:
      - .github/workflows/blacksite-ci.yml
      - apps/blacksite/**
      - math/games/blacksite_breach/**
      - packages/config-svelte/**
      - packages/config-ts/**
      - packages/utils-shared/**
      - scripts/blacksite-*.mjs
      - docs/blacksite/RELEASE_EVIDENCE_51.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    branches:
      - codex/blacksite-aaa-studio
    paths:
      - .github/workflows/blacksite-ci.yml
      - apps/blacksite/**
      - math/games/blacksite_breach/**
      - packages/config-svelte/**
      - packages/config-ts/**
      - packages/utils-shared/**
      - scripts/blacksite-*.mjs
      - docs/blacksite/RELEASE_EVIDENCE_51.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blacksite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blacksite-quality:
    name: blacksite/quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      NODE_NO_WARNINGS: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'
      NPM_CONFIG_LOGLEVEL: error

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.5.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Record exact test identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${#EXPECTED_SHA}" -eq 40
          test "$actual_sha" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
          mkdir -p "${RUNNER_TEMP}/blacksite-ci"
          {
            printf 'git_sha=%s\n' "$actual_sha"
            printf 'node=%s\n' "$(node --version)"
            printf 'pnpm=%s\n' "$(pnpm --version)"
          } > "${RUNNER_TEMP}/blacksite-ci/identity.txt"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Lint BlackSite
        run: pnpm --filter blacksite lint

      - name: Typecheck BlackSite
        run: pnpm --filter blacksite check

      - name: Test BlackSite contracts
        run: pnpm --filter blacksite test

      - name: Build BlackSite production frontend
        run: pnpm --filter blacksite build

      - name: Verify BlackSite math candidate
        run: pnpm blacksite:math:test

      - name: Generate and verify isolated BlackSite package
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          candidate_root="${RUNNER_TEMP}/blacksite-candidate-${EXPECTED_SHA}"
          frontend_tree="$(node scripts/blacksite-package-candidate.mjs --print-frontend-tree-sha256)"
          test "${#frontend_tree}" -eq 64
          node scripts/blacksite-package-candidate.mjs \
            --output "$candidate_root" \
            --expected-commit "$EXPECTED_SHA" \
            --expected-frontend-tree "$frontend_tree"
          node scripts/blacksite-package-verify.mjs \
            --candidate "$candidate_root" \
            --write-result
          mkdir -p artifacts/blacksite-ci
          mkdir -p artifacts/blacksite-package
          cp "${RUNNER_TEMP}/blacksite-ci/identity.txt" artifacts/blacksite-ci/
          cp "$candidate_root/candidate-manifest.json" artifacts/blacksite-package/
          cp "$candidate_root/package-verification.json" artifacts/blacksite-package/
          cp "$candidate_root/README_UPLOAD_CANDIDATE.txt" artifacts/blacksite-package/
          printf 'candidate_root=%s\nfrontend_tree_sha256=%s\n' \
            "$candidate_root" "$frontend_tree" \
            > artifacts/blacksite-package/identity.txt
          printf 'BLACKSITE_CANDIDATE_ROOT=%s\n' "$candidate_root" >> "$GITHUB_ENV"
          printf 'BLACKSITE_FRONTEND_TREE_SHA256=%s\n' "$frontend_tree" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test exact extracted frontend in Chromium
        run: |
          BLACKSITE_QA_BUILD_ROOT="${BLACKSITE_CANDIDATE_ROOT}/frontend" \
          BLACKSITE_QA_EXPECTED_BUILD_TREE_SHA256="${BLACKSITE_FRONTEND_TREE_SHA256}" \
          node scripts/blacksite-qa-e2e.mjs

      - name: Resolve exact 51-point candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t browser_evidence < <(find artifacts/blacksite-qa -type f -name blacksite-browser-evidence.json -print)
          test "${#browser_evidence[@]}" -eq 1
          node scripts/blacksite-compliance-evidence.mjs \
            --candidate "${BLACKSITE_CANDIDATE_ROOT}" \
            --browser-evidence "${browser_evidence[0]}" \
            --output artifacts/blacksite-compliance/blacksite-51-evidence.json

      - name: Upload BlackSite diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blacksite-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/blacksite-ci/**
            artifacts/blacksite-package/**
            artifacts/blacksite-qa/**
            artifacts/blacksite-compliance/**
