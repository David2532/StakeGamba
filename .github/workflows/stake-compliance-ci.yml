name: Stake Compliance CI

on:
  push:
    branches:
      - main
      - agent/stake-compliance-final
      - codex/stake-review-2026-07-29
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stake-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stake-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_NO_WARNINGS: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
      NPM_CONFIG_LOGLEVEL: error
      STAKE_QA_REQUIRE_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build workspace
        run: npm run build

      - name: Generate deterministic frontend
        run: node apps/cluster/scripts/build-preview-html.mjs

      - name: Publish exact frontend and math upload directories
        run: npm run stake:publish

      - name: Static Stake QA
        run: npm run stake:qa

      - name: Social wording and Replay QA
        run: npm run stake:qa:social && npm run stake:qa:replay

      - name: Wallet, feature-summary, and paytable QA
        run: npm run stake:qa:wallet && npm run stake:qa:paytable && npm run stake:qa:math

      - name: Documentation and evidence gate
        run: npm run stake:qa:docs:write && npm run stake:qa:docs

      - name: Clean regeneration gate
        shell: bash
        run: |
          node apps/cluster/scripts/build-preview-html.mjs --check
          npm run stake:publish
          git diff --exit-code -- apps/cluster/preview.html publish/frontend/index.html publish/math
