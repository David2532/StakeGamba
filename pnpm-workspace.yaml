  "@isaacs/brace-expansion": "5.0.1"
  "@sveltejs/kit": "2.57.1"
  "@xmldom/xmldom": "0.8.15"
  "brace-expansion@<2": "1.1.18"
  "brace-expansion@>=4 <5.0.9": "5.0.9"
  browserslist: "4.28.7"
  flatted: "3.4.2"
  glob: "12.0.0"
  immutable: "5.1.8"
  js-yaml: "4.3.1"
  lodash: "4.18.1"
  "minimatch@<4": "3.1.4"
  "minimatch@>=10 <10.2.3": "10.2.5"
  "nanoid@<4": "3.3.18"
  "picomatch@<3": "2.3.2"
  postcss: "8.5.18"
  rollup: "4.59.0"
